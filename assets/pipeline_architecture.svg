<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="cardGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="750" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="1196" height="746" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Header Banner -->
  <text x="600" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    Pre-Trained Deep CNN Dog Breed Classifier Pipeline
  </text>
  <text x="600" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#94a3b8" text-anchor="middle">
    Automated 6-Stage Computer Vision Evaluation Flow (ResNet-18 • AlexNet • VGG-16)
  </text>

  <!-- ==================== ROW 1: STAGES 1, 2, 3 ==================== -->

  <!-- STAGE 1: CLI ARGUMENTS -->
  <g transform="translate(50, 110)" filter="url(#dropShadow)">
    <rect width="330" height="175" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <!-- Card Header -->
    <rect width="330" height="38" rx="12" fill="url(#cardGrad1)"/>
    <rect y="26" width="330" height="12" fill="#1d4ed8"/>
    <text x="16" y="25" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Stage 1: CLI Configuration</text>
    
    <!-- Script File Pill (Dedicated Sub-Row) -->
    <rect x="16" y="48" width="185" height="22" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="24" y="63" font-family="'Cascadia Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#93c5fd">📄 get_input_args.py</text>
    
    <!-- Bullet Points -->
    <text x="16" y="93" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Argparse terminal user parameters</text>
    <text x="16" y="113" font-family="'Cascadia Code', Consolas, monospace" font-size="11" fill="#bfdbfe">  --dir &lt;path&gt; [pet_images/]</text>
    <text x="16" y="131" font-family="'Cascadia Code', Consolas, monospace" font-size="11" fill="#bfdbfe">  --arch &lt;model&gt; [vgg/resnet/alexnet]</text>
    <text x="16" y="149" font-family="'Cascadia Code', Consolas, monospace" font-size="11" fill="#bfdbfe">  --dogfile &lt;file&gt; [dognames.txt]</text>
  </g>

  <!-- Connector: 1 to 2 -->
  <line x1="380" y1="197" x2="435" y2="197" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- STAGE 2: PET IMAGE LABELS -->
  <g transform="translate(435, 110)" filter="url(#dropShadow)">
    <rect width="330" height="175" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <!-- Card Header -->
    <rect width="330" height="38" rx="12" fill="url(#cardGrad2)"/>
    <rect y="26" width="330" height="12" fill="#6d28d9"/>
    <text x="16" y="25" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Stage 2: Label Extraction</text>
    
    <!-- Script File Pill -->
    <rect x="16" y="48" width="185" height="22" rx="4" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="24" y="63" font-family="'Cascadia Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#c4b5fd">📄 get_pet_labels.py</text>
    
    <!-- Bullet Points -->
    <text x="16" y="93" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Read images from directory</text>
    <text x="16" y="113" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Filter underscores &amp; numeric IDs</text>
    <text x="16" y="133" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Lowercase string normalization</text>
    <text x="16" y="153" font-family="'Cascadia Code', Consolas, monospace" font-size="11" fill="#ddd6fe">  results_dic[file] = [pet_label]</text>
  </g>

  <!-- Connector: 2 to 3 -->
  <line x1="765" y1="197" x2="820" y2="197" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- STAGE 3: CNN CLASSIFIER -->
  <g transform="translate(820, 110)" filter="url(#dropShadow)">
    <rect width="330" height="175" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <!-- Card Header -->
    <rect width="330" height="38" rx="12" fill="url(#cardGrad3)"/>
    <rect y="26" width="330" height="12" fill="#b45309"/>
    <text x="16" y="25" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Stage 3: CNN Classification</text>
    
    <!-- Script File Pill -->
    <rect x="16" y="48" width="230" height="22" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="24" y="63" font-family="'Cascadia Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#fde68a">📄 classify_images.py / classifier</text>
    
    <!-- Bullet Points -->
    <text x="16" y="93" font-family="sans-serif" font-size="12" fill="#cbd5e1">• PyTorch tensor transform (224×224)</text>
    <text x="16" y="113" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Model evaluation (ResNet/AlexNet/VGG)</text>
    <text x="16" y="133" font-family="sans-serif" font-size="12" fill="#cbd5e1">• ImageNet class ID to label mapping</text>
    <text x="16" y="153" font-family="'Cascadia Code', Consolas, monospace" font-size="11" fill="#fde68a">  results_dic: [truth, pred, match]</text>
  </g>

  <!-- Connecting Bus Downward from Stage 3 to Stage 4 -->
  <path d="M 985 285 L 985 340 L 215 340 L 215 385" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ==================== ROW 2: STAGES 4, 5, 6 ==================== -->

  <!-- STAGE 4: IS-A-DOG VERIFICATION -->
  <g transform="translate(50, 385)" filter="url(#dropShadow)">
    <rect width="330" height="185" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <!-- Card Header -->
    <rect width="330" height="38" rx="12" fill="url(#cardGrad4)"/>
    <rect y="26" width="330" height="12" fill="#047857"/>
    <text x="16" y="25" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Stage 4: "Is-A-Dog" Verification</text>
    
    <!-- Script File Pill -->
    <rect x="16" y="48" width="220" height="22" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="24" y="63" font-family="'Cascadia Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#6ee7b7">📄 adjust_results4_isadog.py</text>
    
    <!-- Bullet Points -->
    <text x="16" y="93" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Ingest dognames.txt dictionary</text>
    <text x="16" y="113" font-family="sans-serif" font-size="12" fill="#cbd5e1">• O(1) hash map membership check</text>
    <text x="16" y="133" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Flag true label: dog=1, non-dog=0</text>
    <text x="16" y="153" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Flag predicted label: dog=1, non-dog=0</text>
    <text x="16" y="171" font-family="'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#a7f3d0">  results_dic: [.., is_dog, pred_dog]</text>
  </g>

  <!-- Connector: 4 to 5 -->
  <line x1="380" y1="477" x2="435" y2="477" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- STAGE 5: CALCULATE RESULTS STATS -->
  <g transform="translate(435, 385)" filter="url(#dropShadow)">
    <rect width="330" height="185" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <!-- Card Header -->
    <rect width="330" height="38" rx="12" fill="url(#cardGrad5)"/>
    <rect y="26" width="330" height="12" fill="#be185d"/>
    <text x="16" y="25" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Stage 5: Metrics Aggregation</text>
    
    <!-- Script File Pill -->
    <rect x="16" y="48" width="230" height="22" rx="4" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
    <text x="24" y="63" font-family="'Cascadia Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#f472b6">📄 calculates_results_stats.py</text>
    
    <!-- Bullet Points -->
    <text x="16" y="93" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Count n_images, n_dogs, n_notdogs</text>
    <text x="16" y="113" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Compute % correct dogs (n_dogs/tot)</text>
    <text x="16" y="133" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Compute % correct breeds (n_breed/n_dog)</text>
    <text x="16" y="153" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Defensive ZeroDivisionError guards</text>
    <text x="16" y="171" font-family="'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#fbcfe8">  results_stats_dic = {pct_*, n_*}</text>
  </g>

  <!-- Connector: 5 to 6 -->
  <line x1="765" y1="477" x2="820" y2="477" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- STAGE 6: PRINT RESULTS -->
  <g transform="translate(820, 385)" filter="url(#dropShadow)">
    <rect width="330" height="185" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <!-- Card Header -->
    <rect width="330" height="38" rx="12" fill="url(#cardGrad6)"/>
    <rect y="26" width="330" height="12" fill="#0e7490"/>
    <text x="16" y="25" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Stage 6: Diagnostic Reporting</text>
    
    <!-- Script File Pill -->
    <rect x="16" y="48" width="185" height="22" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
    <text x="24" y="63" font-family="'Cascadia Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#67e8f9">📄 print_results.py</text>
    
    <!-- Bullet Points -->
    <text x="16" y="93" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Formatted console summary table</text>
    <text x="16" y="113" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Print misclassified Dog/Not-Dog cases</text>
    <text x="16" y="133" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Print misclassified canine breeds</text>
    <text x="16" y="153" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Total elapsed program runtime</text>
    <text x="16" y="171" font-family="'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#cffafe">  Outputs: stdout &amp; results/*.txt</text>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(50, 610)">
    <rect width="1100" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="32" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#38bdf8">Supported Models &amp; Benchmarking Targets:</text>
    <text x="24" y="58" font-family="sans-serif" font-size="12.5" fill="#94a3b8">
      • <tspan fill="#34d399" font-weight="bold">VGG-16</tspan> (93.3% Breed Acc, 100% Dog Acc, 20s latency) • <tspan fill="#60a5fa" font-weight="bold">ResNet-18</tspan> (90.0% Breed Acc, 100% Dog Acc, 5s latency) • <tspan fill="#fbbf24" font-weight="bold">AlexNet</tspan> (80.0% Breed Acc, 100% Dog Acc, 3s latency)
    </text>
  </g>
</svg>
